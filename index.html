<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
">

    <div style="
        width: 90%;
        max-width: 600px;
        text-align: center;
        background: #ffffff;
        padding: 50px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    ">

        <!-- Icon -->
        <div style="
            font-size: 70px;
            margin-bottom: 20px;
        ">
            🛠️
        </div>

        <!-- Heading -->
        <h1 style="
            margin: 0 0 15px 0;
            font-size: 38px;
            color: #222222;
        ">
            Website Under Maintenance
        </h1>

        <!-- Description -->
        <p style="
            margin: 0 auto 25px auto;
            max-width: 500px;
            font-size: 17px;
            line-height: 1.7;
            color: #666666;
        ">
            We're currently working on some improvements to make
            your experience even better.
        </p>

        <p style="
            font-size: 16px;
            color: #444444;
            margin-bottom: 30px;
        ">
            Please check back soon.
        </p>

        <!-- Button -->
        <a href="mailto:support@example.com" style="
            display: inline-block;
            padding: 13px 25px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
        ">
            Contact Us
        </a>

        <!-- Footer -->
        <p style="
            margin-top: 35px;
            margin-bottom: 0;
            font-size: 13px;
            color: #999999;
        ">
            © 2026 Your Company. All rights reserved.
        </p>

    </div>

</body>
</html>
